    - name: file
      description: Gets a quick indicator of the risk associated with a file.
      arguments:
        - name: file
          required: true
          default: true
          isArray: true
          description: File hash for which to get the reputation. Supports MD5, SHA1, SHA256, and SHA512.
        - name: collective_insights
          description: Save IOC to Collective Insights? If not specified - uses the integration setting value.
          required: false
          auto: PREDEFINED
          predefined:
